<title>宿根草マスター 試作表 11月19日版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 一列の記入台帳。上に前提の質問、下に項目ごとの判定行。進捗バーを上部に固定。 */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1f2a24; --muted:#5d6b63; --line:#d6ddd7;
  --accent:#2f6b4a; --accent-soft:#e1efe6; --ochre:#9a6a1f; --ochre-soft:#f6ecd9;
  --warn:#a33b2b; --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-head:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#33403a;
  --accent:#7cc79c; --accent-soft:#22382c; --ochre:#e0b46a; --ochre-soft:#3a3020; --warn:#f08a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#33403a;
  --accent:#7cc79c; --accent-soft:#22382c; --ochre:#e0b46a; --ochre-soft:#3a3020; --warn:#f08a7a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.3}
h2{font-size:1.2rem;margin:40px 0 4px}
.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:20px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.prog{flex:1 1 220px;min-width:0}
.prog-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.prog-label{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.save{font-size:.85rem;color:var(--muted)}
.save.err{color:var(--warn)}
.toggle{font-size:.85rem;display:flex;gap:6px;align-items:center;cursor:pointer}
.howto{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin-top:20px;font-size:.92rem}
.howto ol{margin:4px 0 0;padding-left:1.4em}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:12px}
.q h3{font-size:1rem;line-height:1.5}
.q .hint{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.qn{color:var(--accent);margin-right:.4em;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.9rem;cursor:pointer;background:var(--bg);user-select:none}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt input:focus-visible+span{outline:2px solid var(--ochre);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:.92rem;background:var(--bg);color:var(--fg);min-height:2.6em;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.group-desc{color:var(--muted);font-size:.9rem;margin:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px}
.item.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item-name{font-weight:700;font-size:1rem}
.badge{font-size:.72rem;letter-spacing:.04em;padding:1px 8px;border-radius:4px;white-space:nowrap}
.b-now{background:var(--line);color:var(--fg)}
.b-new{background:var(--ochre-soft);color:var(--ochre)}
.b-site{background:var(--accent-soft);color:var(--accent)}
.note{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.prop{font-size:.88rem;margin:2px 0 0}
.prop b{color:var(--ochre);font-weight:700}
.row-label{font-size:.78rem;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.row-label + .opts{margin-top:4px}
.help{font-size:.88rem;margin:6px 0 0;background:var(--ochre-soft);border-radius:6px;padding:6px 10px}
.help b{color:var(--ochre)}
.newmark{font-size:.72rem;color:var(--ochre);border:1px solid var(--ochre);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.hidden-done .item.done,.hidden-done .q.done{display:none}
.foot{margin-top:40px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.prog-fill{transition:none}}
.decided{margin:6px 0 0;padding-left:1.3em}
.decided li{margin:2px 0}
.def{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:10px 0 0;font-size:.9rem}
.def dt{color:var(--muted);font-size:.8rem;padding-top:.15em}
.def dd{margin:0;min-width:0}
.b-lit{background:var(--accent-soft);color:var(--accent)}
.b-rule{background:var(--ochre-soft);color:var(--ochre)}
.b-own{background:var(--line);color:var(--fg)}
.b-auto{border:1px solid var(--line);color:var(--muted)}
.odds-h{color:var(--accent);border:1px solid var(--accent)}
.odds-m{color:var(--ochre);border:1px solid var(--ochre)}
.odds-l{color:var(--warn);border:1px solid var(--warn)}

.tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;flex:1 1 320px;min-width:0}
.tools input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--fg)}
.plant{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px}
.plant>summary{cursor:pointer;padding:12px 16px;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.plant>summary::-webkit-details-marker{display:none}
.plant>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pno{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem;min-width:3em}
.pname{font-weight:700;flex:1 1 240px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;flex-basis:100%}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 9px;white-space:nowrap;color:var(--muted)}
.chip b{color:var(--fg);font-weight:700}
.chip.chg{border-color:var(--ochre);color:var(--ochre)}
.pbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.pbody h3{font-size:.82rem;color:var(--accent);letter-spacing:.06em;margin:16px 0 2px}
.kv{display:grid;grid-template-columns:11em 1fr;gap:0 12px;margin:0;font-size:.92rem}
.kv dt{color:var(--muted);font-size:.84rem;padding:5px 0;border-top:1px solid var(--line)}
.kv dd{margin:0;min-width:0;padding:5px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.kv .empty{color:var(--muted)}
.kv dd.changed{background:var(--ochre-soft);padding-left:8px;padding-right:8px;border-radius:4px}
.was{display:block;font-size:.82rem;color:var(--ochre);margin-top:2px}
.src{font-size:.72rem;color:var(--muted);margin-left:6px;white-space:nowrap}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{padding-bottom:0}.kv dd{border-top:0;padding-top:0}}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.only-chg .kv dt[data-chg="0"],.only-chg .kv dd[data-chg="0"]{display:none}
</style>
<div class="wrap">
  <h1>試作表 11月19日版</h1>
  <p class="lead">試作28品種の値です。MBG・YList・stauden.de の記述と、11月18日・19日の決定を反映しています。黄土色の欄は今回変わった値で、前の値と理由を添えています。価格・在庫は載せていません。</p>
  <div class="bar">
    <div class="tools">
      <input type="search" id="q" placeholder="植物名・学名・値で絞り込む" aria-label="絞り込み">
      <label class="toggle"><input type="checkbox" id="onlyChg"> 変わった欄だけ見る</label>
      <span class="count" id="count"></span>
    </div>
    <span class="save" id="saveState" aria-live="polite"></span>
  </div>
  <div id="list"></div>
  <h2>全体へのメモ</h2>
  <div class="q">
    <h3>景観構成用途の基準の数字、全件の進め方など、気づいたことを書いてください。</h3>
    <textarea id="t-free" data-id="free" rows="4"></textarea>
  </div>
  <p class="foot">メモは自動で保存され、Claudeが読み取ります。書き終わったら会話で「書き込んだ」と伝えてください。空欄は、文献に記述がなかった項目です。</p>
</div>
<script>
const D=/*__DATA__*/null;
const memo={};const timers={};const writing={};const again={};const pending=new Set();let db=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function setSave(t,err){const el=document.getElementById("saveState");el.textContent=t;el.classList.toggle("err",!!err)}
function show(v){return v===null||v===undefined||v===""?'<span class="empty">（空欄）</span>':esc(v)}
function card(p){
  const chg={};p.ch.forEach(c=>{chg[c.col]=c});
  if(chg["USDA 下限"]||chg["USDA 上限"]){const a=chg["USDA 下限"],b=chg["USDA 上限"];chg["USDA"]={old:`下限 ${a?a.old:"同じ"}／上限 ${b?b.old:"同じ"}`,why:(a||b).why}}
  if(chg["株張り 最小(cm)"]||chg["株張り 最大(cm)"]){const a=chg["株張り 最小(cm)"],b=chg["株張り 最大(cm)"];chg["株張り(cm)"]={old:`最小 ${a?a.old:"同じ"}／最大 ${b?b.old:"同じ"}`,why:(a||b).why}}
  const v=p.v;const chip=(k,l)=>v[k]?`<span class="chip">${l} <b>${esc(v[k])}</b></span>`:"";
  return `<details class="plant" data-no="${esc(p.no)}">
   <summary><span class="pno">${esc(p.no)}</span><span class="pname">${esc(p.name)}</span>
    <span class="chips">${chip("耐寒性","耐寒")}${chip("耐暑性","耐暑")}${chip("管理タイプ","")}${chip("景観構成用途","")}${p.ch.length?`<span class="chip chg">変更 ${p.ch.length}件</span>`:""}</span></summary>
   <div class="pbody">
    ${D.groups.map(g=>`<h3>${esc(g[0])}</h3><dl class="kv">${g[1].map(k=>{const c=chg[k];
      return `<dt class="${c?"is-chg":""}" data-chg="${c?1:0}">${esc(k)}<span class="src">${esc(D.how[k]||"")}</span></dt><dd class="${c?"changed":""}" data-chg="${c?1:0}">${show(v[k])}${c?`<span class="was">前：${c.old===null||c.old===undefined?"（空欄）":esc(c.old)}　理由：${esc(c.why)}</span>`:""}</dd>`}).join("")}</dl>`).join("")}
    <h3>メモ</h3>
    <textarea id="t-${esc(p.no)}" data-id="${esc(p.no)}" rows="2" placeholder="この品種で直したい値、気づいたこと"></textarea>
   </div></details>`;
}
function filter(){
  const q=document.getElementById("q").value.trim().toLowerCase();const only=document.getElementById("onlyChg").checked;let n=0;
  document.body.classList.toggle("only-chg",only);
  D.plants.forEach(p=>{const el=document.querySelector(`.plant[data-no="${CSS.escape(p.no)}"]`);
    const hay=(p.no+" "+p.name+" "+Object.values(p.v).join(" ")).toLowerCase();
    const ok=(!q||hay.includes(q))&&(!only||p.ch.length>0);el.hidden=!ok;if(ok)n++});
  document.getElementById("count").textContent=`${n} / ${D.plants.length} 品種`;
}
function schedule(id){pending.add(id);setSave(db?"保存待ち…":"この画面では保存できません（会話でClaudeに直接お伝えください）",!db);clearTimeout(timers[id]);timers[id]=setTimeout(()=>write(id),900)}
async function write(id){
  if(!db)return;if(writing[id]){again[id]=true;return}
  timers[id]=null;writing[id]=true;setSave("保存中…");
  try{await db.doc("memos/"+id).set({memo:memo[id]||"",updatedAt:new Date().toISOString()});setSave("保存しました")}
  catch(err){if(err&&err.code==="unavailable")setTimeout(()=>write(id),800+Math.random()*800);else setSave("保存できませんでした（"+(err&&err.code||"error")+"）",true)}
  finally{writing[id]=false;if(again[id]){again[id]=false;write(id)}else if(!timers[id])pending.delete(id)}
}
function init(){
  document.getElementById("list").innerHTML=D.plants.map(card).join("");filter();
  document.getElementById("q").addEventListener("input",filter);
  document.getElementById("onlyChg").addEventListener("change",filter);
  document.addEventListener("input",e=>{const t=e.target;if(t.tagName==="TEXTAREA"&&t.dataset.id){memo[t.dataset.id]=t.value;schedule(t.dataset.id)}});
  const loadTimer=setTimeout(()=>setSave("保存先に接続できていません。メモは保存されない可能性があります",true),10000);
  Promise.resolve(window.claude?.use?.("db")).then(d=>{
    if(!d){clearTimeout(loadTimer);setSave("この画面ではメモを保存できません（会話でClaudeに直接お伝えください）",true);return}
    db=d;
    db.collection("memos").onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(loadTimer);if(!pending.size)setSave("")}
      snap.docs.forEach(doc=>{if(pending.has(doc.id))return;const v=doc.data()||{};memo[doc.id]=typeof v.memo==="string"?v.memo:"";
        const ta=document.getElementById("t-"+doc.id);if(ta&&document.activeElement!==ta)ta.value=memo[doc.id]});
    },err=>{clearTimeout(loadTimer);setSave("保存先との接続が切れました（"+err.code+"）",true)});
  }).catch(()=>{clearTimeout(loadTimer);setSave("この画面ではメモを保存できません",true)});
}
init();
</script>
