<title>宿根草マスター 11月19日の確認</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 一列の記入台帳。上に前提の質問、下に項目ごとの判定行。進捗バーを上部に固定。 */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1f2a24; --muted:#5d6b63; --line:#d6ddd7;
  --accent:#2f6b4a; --accent-soft:#e1efe6; --ochre:#9a6a1f; --ochre-soft:#f6ecd9;
  --warn:#a33b2b; --font-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-head:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#33403a;
  --accent:#7cc79c; --accent-soft:#22382c; --ochre:#e0b46a; --ochre-soft:#3a3020; --warn:#f08a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --fg:#e4ebe6; --muted:#9aa9a0; --line:#33403a;
  --accent:#7cc79c; --accent-soft:#22382c; --ochre:#e0b46a; --ochre-soft:#3a3020; --warn:#f08a7a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.3}
h2{font-size:1.2rem;margin:40px 0 4px}
.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:20px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.prog{flex:1 1 220px;min-width:0}
.prog-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.prog-label{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.save{font-size:.85rem;color:var(--muted)}
.save.err{color:var(--warn)}
.toggle{font-size:.85rem;display:flex;gap:6px;align-items:center;cursor:pointer}
.howto{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin-top:20px;font-size:.92rem}
.howto ol{margin:4px 0 0;padding-left:1.4em}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:12px}
.q h3{font-size:1rem;line-height:1.5}
.q .hint{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.qn{color:var(--accent);margin-right:.4em;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.9rem;cursor:pointer;background:var(--bg);user-select:none}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt input:focus-visible+span{outline:2px solid var(--ochre);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:.92rem;background:var(--bg);color:var(--fg);min-height:2.6em;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.group-desc{color:var(--muted);font-size:.9rem;margin:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px}
.item.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item-name{font-weight:700;font-size:1rem}
.badge{font-size:.72rem;letter-spacing:.04em;padding:1px 8px;border-radius:4px;white-space:nowrap}
.b-now{background:var(--line);color:var(--fg)}
.b-new{background:var(--ochre-soft);color:var(--ochre)}
.b-site{background:var(--accent-soft);color:var(--accent)}
.note{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.prop{font-size:.88rem;margin:2px 0 0}
.prop b{color:var(--ochre);font-weight:700}
.row-label{font-size:.78rem;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.row-label + .opts{margin-top:4px}
.help{font-size:.88rem;margin:6px 0 0;background:var(--ochre-soft);border-radius:6px;padding:6px 10px}
.help b{color:var(--ochre)}
.newmark{font-size:.72rem;color:var(--ochre);border:1px solid var(--ochre);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.hidden-done .item.done,.hidden-done .q.done{display:none}
.foot{margin-top:40px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.prog-fill{transition:none}}
.decided{margin:6px 0 0;padding-left:1.3em}
.decided li{margin:2px 0}
.def{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;margin:10px 0 0;font-size:.9rem}
.def dt{color:var(--muted);font-size:.8rem;padding-top:.15em}
.def dd{margin:0;min-width:0}
.b-lit{background:var(--accent-soft);color:var(--accent)}
.b-rule{background:var(--ochre-soft);color:var(--ochre)}
.b-own{background:var(--line);color:var(--fg)}
.b-auto{border:1px solid var(--line);color:var(--muted)}
.odds-h{color:var(--accent);border:1px solid var(--accent)}
.odds-m{color:var(--ochre);border:1px solid var(--ochre)}
.odds-l{color:var(--warn);border:1px solid var(--warn)}
</style>


<div class="wrap">
  <h1>11月19日の確認</h1>
  <p class="lead">文献が読めるかの確認が終わりました。試作表を作り直す前に決めたいことを11個にまとめています。当てはまるものを選んでください。補足はメモ欄に書けます。</p>
  <div class="bar">
    <div class="prog">
      <div class="prog-label" id="progLabel">読み込み中…</div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    </div>
    <label class="toggle"><input type="checkbox" id="hideDone"> 記入済みを隠す</label>
    <span class="save" id="saveState" aria-live="polite"></span>
  </div>
  <div id="sections"></div>
  <h2>自由記入</h2>
  <div class="q" data-id="free">
    <h3>ほかに気づいたことがあれば書いてください。</h3>
    <textarea id="t-free" data-id="free" data-field="memo" rows="4"></textarea>
  </div>
  <p class="foot">記入内容は自動で保存され、Claudeが読み取ります。書き終わったら会話で「書き込んだ」と伝えてください。</p>
</div>

<script>
const SECTIONS=[
 {title:"第1部　文献の読み方",desc:"MBG・YList・stauden.de 無料版は読めて、試作28品種に追記しました。Jelitto と Gaißmayer は自動アクセスを止める仕組み（Cloudflare）で読めていません。",list:[
  {id:"c01",t:"Jelitto と Gaißmayer は、どうしますか？",h:"この2つは、パソコンの Chrome（Claude in Chrome）からでないと読めません。Jelitto はこぼれ種・耐塩性、Gaißmayer は草丈・株張り・花期・日照・土壌を見る予定でした。stauden.de 無料版に株張りはありません（あるのは植え付け間隔）。",o:["パソコンの Chrome で読む","今回は見送り、MBG・stauden.de で代える","Gaißmayer だけ読む","Jelitto だけ読む"]},
  {id:"c02",t:"stauden.de の有料版（Profi-Stauden-Datenbank）は、どうしますか？",h:"無料版で読めた項目：花の高さ、花期、草姿、増え方（株立ち・地下茎・ランナー、こぼれ種の程度）、葉の時期（夏緑・冬緑・常緑）、日照、耐寒ゾーン、土の湿り、原産地、切り戻しの時期、冬の保護、繁殖方法、毒・香り、切り花・蜜源、品種評価の星と評価年。試作28品種のうち25品種が見つかりました。読めないもの：暑さ・蒸れの文章、病害虫、株張り。",o:["無料版で足りるので契約しない","見積もりを取って検討する","試作表を見てから決める"]},
  {id:"c03",t:"文献どうしが食い違うときの、MBG と stauden.de の順位は、仮に次のように置きました。これでよいですか？",h:"暑さ・蒸れ：NC State ＞ MBG ＞ RHS。耐寒：シカゴ ＞ ミネソタ大 ＞ RHS ＞ MBG。その他：RHS ＞ シカゴ ＞ NC State ＞ MBG ＞ …＞ stauden.de。MBG はセントルイス（夏が高温多湿）の植物園なので、暑さでは NC State の次にしました。stauden.de は用語を選ぶ形式なので、ほかの文献に記述がない項目を埋めるのに使います。",o:["これでよい","変えたい（メモに）"]},
  {id:"c04",t:"stauden.de（ドイツ）の耐寒ゾーン・花期・花の高さは、どう扱いますか？",h:"耐寒性・花期・草丈は「今のマスターの値を使う」と決まっているので、今は記録だけにしています。",o:["記録だけでよい","今のマスターと食い違うものを一覧にして見る"]}
 ]},
 {title:"第2部　マスターの項目",desc:"",list:[
  {id:"c05",t:"YList の和名は、どう入れますか？",h:"28品種のうち17品種で標準和名がありました（例：アジュガ レプタンス＝セイヨウジュウニヒトエ、リシマキア ヌンムラリア＝コバンコナスビ、エキナセア プルプレア＝ムラサキバレンギク、フロックス パニキュラータ＝クサキョウチクトウ）。交配品種や日本に縁の薄い種にはありません。",o:["「和名」列を作り、YList の標準和名を入れる（ないものは空欄）","今の「別名」列はそのまま。YList は確認用の記録だけ"]},
  {id:"c06",t:"アジュガ 'バーガンディグロウ' の「隔離推奨型」は、どうしますか？",h:"品種そのものの記述はなく、種（Ajuga reptans）の記述からの判定です。MBG：ランナーで広がる。広がる性質のため、宿根草の花壇や芝生の近くには植えない。NC State：旺盛に広がり、米国の他地域では侵略的。",o:["隔離推奨型にする","隔離推奨型にしない（「強い・配置注意」まで）","空欄にする"]},
  {id:"c07",t:"スピレア 'ゴールドフレーム' の「隔離推奨型」は、どうしますか？",h:"MBG：こぼれ種で強く増えることがあり、米国東部の多くの地域で庭から逸出して野生化している。ひこばえでも広がる。これも種（Spiraea japonica）についての記述です。シモツケは日本の在来種です。",o:["隔離推奨型にする","隔離推奨型にしない","空欄にする"]},
  {id:"c08",t:"景観構成用途の基準の数字は、いつ決めますか？",h:"今の仮の基準：草丈30cm以下＝前景、80cm以下＝中景、それより高い＝後景。マット状または草丈20cm以下でランナー・地下茎＝グラウンドカバー。グラス・アーチ形で60cm以上、または株張り90cm以上＝主役。株張り40cm以下＝群植向き。",o:["試作表を見てから決める","今、数字を伝える（メモに）","仮の基準のままでよい"]},
  {id:"c09",t:"耐暑性の「中」の決め方を、1つ足しました。これでよいですか？",h:"決定どおり、暑さの記述がなければ空欄にします。そのうえで、「暑い地域では午後の日陰を好む」「暑い所で日なただと葉が焼ける」のように条件つきで育つ記述だけのときを「中」としました。弱＝暑さ・高温多湿に弱いと明記、強＝暑さ・湿気に耐えると明記、は前のままです。",o:["これでよい","条件つきの記述だけなら空欄にする","変えたい（メモに）"]}
 ]},
 {title:"第3部　このあとの進め方",desc:"",list:[
  {id:"c10",t:"試作表（Excel）を作り直したら、どの形で受け取りますか？",h:"元のマスターの価格・在庫を含むので、公開リポジトリには入れません。",o:["この会話で Excel ファイルを受け取る","確認用のページで見る（価格・在庫は載せない）","両方"]},
  {id:"c11",t:"試作28品種が固まったあと、全件（約1,000品種）はどう進めますか？",h:"MBG・YList・stauden.de は自動で取得できます。文献の記述を値に当てはめる作業は、品種ごとに判断が要ります。",o:["100品種ずつ進め、区切りごとに確認する","属ごとに進める","一度に全件進め、最後にまとめて確認する","試作表を見てから決める"]}
 ]}
];
const ALL_IDS=SECTIONS.flatMap(s=>s.list.map(q=>q.id));
const state={}; const pending=new Set(); const timers={}; const writing={}; const again={};
let db=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function opt(id,field,val,multi,i){
  return `<label class="opt"><input type="radio" id="${id}-${field}-${i}" name="${id}-${field}" data-id="${id}" data-field="${field}" value="${esc(val)}"><span>${esc(val)}</span></label>`;
}
function render(){
  document.getElementById("sections").innerHTML=SECTIONS.map(sec=>`
   <h2>${esc(sec.title)}</h2>${sec.desc?`<p class="group-desc">${esc(sec.desc)}</p>`:""}
   ${sec.list.map((q,n)=>`
   <div class="q" data-id="${q.id}">
    <h3><span class="qn">${n+1}.</span>${esc(q.t)}</h3>
    ${q.h?`<p class="hint">${esc(q.h)}</p>`:""}
    <div class="opts">${q.o.map((o,i)=>opt(q.id,"choice",o,false,i)).join("")}</div>
    <textarea id="t-${q.id}" data-id="${q.id}" data-field="memo" rows="1" placeholder="メモ"></textarea>
   </div>`).join("")}`).join("");
}
function get(id){return state[id]||(state[id]={choice:[],memo:""})}
function answered(id){const s=state[id];return !!s&&(s.choice.length>0||(s.memo||"").trim()!=="")}
function box(id){return document.querySelector(`.q[data-id="${id}"],.item[data-id="${id}"]`)}
function paint(id){
  const s=get(id);
  document.querySelectorAll(`input[data-id="${id}"]`).forEach(el=>{el.checked=(s[el.dataset.field]||[]).includes(el.value);el.dataset.was=el.checked?"1":"0"});
  const ta=document.querySelector(`textarea[data-id="${id}"]`);
  if(ta&&document.activeElement!==ta) ta.value=s.memo||"";
  box(id)?.classList.toggle("done",answered(id));
}
function progress(){
  const n=ALL_IDS.filter(answered).length;
  document.getElementById("progLabel").textContent=`記入済み ${n} / ${ALL_IDS.length}`;
  document.getElementById("progFill").style.width=(n/ALL_IDS.length*100)+"%";
}
function setSave(t,err){const el=document.getElementById("saveState");el.textContent=t;el.classList.toggle("err",!!err)}
function touched(id,ms){box(id)?.classList.toggle("done",answered(id));progress();schedule(id,ms)}
function onChange(e){
  const el=e.target;const id=el.dataset.id;if(!id)return;
  const s=get(id);const f=el.dataset.field;
  if(f==="memo")s.memo=el.value;
  else if(el.type==="radio")s[f]=[el.value];
  touched(id,f==="memo"?900:200);
}
function onClickRadio(e){
  const el=e.target;if(el.type!=="radio"||!el.dataset.id)return;
  if(el.dataset.was==="1"){el.checked=false;get(el.dataset.id).choice=[];touched(el.dataset.id,200)}
  document.querySelectorAll(`input[name="${el.name}"]`).forEach(r=>r.dataset.was=r.checked?"1":"0");
}
function schedule(id,ms){
  pending.add(id);setSave(db?"保存待ち…":"この画面では保存できません（会話でClaudeに直接お伝えください）",!db);
  clearTimeout(timers[id]);timers[id]=setTimeout(()=>write(id),ms);
}
async function write(id){
  if(!db)return;
  if(writing[id]){again[id]=true;return}
  timers[id]=null;writing[id]=true;setSave("保存中…");
  const s=get(id);
  try{await db.doc("answers/"+id).set({choice:s.choice,memo:s.memo,updatedAt:new Date().toISOString()});setSave("保存しました")}
  catch(err){
    if(err&&err.code==="unavailable")setTimeout(()=>write(id),800+Math.random()*800);
    else setSave("保存できませんでした（"+(err&&err.code||"error")+"）",true);
  }finally{
    writing[id]=false;
    if(again[id]){again[id]=false;write(id)}else if(!timers[id])pending.delete(id);
  }
}
function init(){
  render();ALL_IDS.concat("free").forEach(paint);progress();
  document.addEventListener("change",onChange);
  document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")onChange(e)});
  document.addEventListener("click",onClickRadio);
  const hide=document.getElementById("hideDone");
  try{hide.checked=localStorage.getItem("hideDone")==="1"}catch(e){}
  const applyHide=()=>{document.body.classList.toggle("hidden-done",hide.checked);try{localStorage.setItem("hideDone",hide.checked?"1":"0")}catch(e){}};
  hide.addEventListener("change",applyHide);applyHide();
  const loadTimer=setTimeout(()=>setSave("保存先に接続できていません。記入は続けられますが、保存されない可能性があります",true),10000);
  Promise.resolve(window.claude?.use?.("db")).then(d=>{
    if(!d){clearTimeout(loadTimer);setSave("この画面では保存できません（会話でClaudeに直接お伝えください）",true);return}
    db=d;
    db.collection("answers").onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(loadTimer);if(!pending.size)setSave("保存済みの内容を表示しています")}
      snap.docs.forEach(doc=>{
        if(pending.has(doc.id))return;
        const v=doc.data()||{};
        state[doc.id]={choice:Array.isArray(v.choice)?v.choice:[],memo:typeof v.memo==="string"?v.memo:""};
        paint(doc.id);
      });
      progress();
    },err=>{clearTimeout(loadTimer);setSave("保存先との接続が切れました（"+err.code+"）",true)});
  }).catch(()=>{clearTimeout(loadTimer);setSave("この画面では保存できません",true)});
}
init();
</script>
